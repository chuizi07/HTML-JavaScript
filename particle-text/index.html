<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>基于canvas的粒子组成文字动画特效</title>
	<style>
	body {
		background-color: #000;
		margin: 0;
		overflow: hidden;
		font-size: 0;
	}
	#canvas {
		width: 100vw;
		height: 100vh;
		display: block;
	}
	#headline {
		display: none;
	}
	</style>
</head>
<body>
<canvas id="canvas"></canvas>
<h1 id="headline">码上入坟</h1>
<script>
(function() {
	var canvas = document.querySelector("#canvas"),
		ctx = canvas.getContext("2d"),
		particles = [],
		amount = 0,
		mouse = { x: -9999, y: -9999 },
		radius = 1,
		colors = [
			"rgba(252,248,254,0.85)",
			"rgba(220,203,255,0.75)",
			"rgba(154,112,124,0.85)",
			"rgba(192,213,255,0.85)",
			"rgba(244,223,254,0.75)"
		],
		headline = document.querySelector("#headline"),
		ww = window.innerWidth,
		wh = window.innerHeight,
		resizeTimer = null;

	function Particle(x, y) {
		this.x = Math.random() * ww;
		this.y = Math.random() * wh;
		this.dest = { x: x, y: y };
		this.r = Math.random() * 2 * Math.PI;
		this.vx = (Math.random() - 0.5) * 25;
		this.vy = (Math.random() - 0.5) * 25;
		this.accX = 0;
		this.accY = 0;
		this.friction = Math.random() * 0.025 + 0.94;
		this.color = colors[Math.floor(Math.random() * colors.length)];
	}

	Particle.prototype.render = function() {
		this.accX = (this.dest.x - this.x) / 1000;
		this.accY = (this.dest.y - this.y) / 1000;
		this.vx += this.accX;
		this.vy += this.accY;
		this.vx *= this.friction;
		this.vy *= this.friction;
		this.x += this.vx;
		this.y += this.vy;

		ctx.fillStyle = this.color;
		ctx.beginPath();
		ctx.arc(this.x, this.y, 1.5, Math.PI * 2, false);
		ctx.fill();

		var a = this.x - mouse.x;
		var b = this.y - mouse.y;
		var distance = Math.sqrt(a * a + b * b);
		if (distance < radius * 75) {
			this.accX = (this.x - mouse.x) / 100;
			this.accY = (this.y - mouse.y) / 100;
			this.vx += this.accX;
			this.vy += this.accY;
		}
	};

	function onMouseMove(e) {
		mouse.x = e.clientX;
		mouse.y = e.clientY;
	}

	function onTouchMove(e) {
		if (e.touches.length > 0) {
			mouse.x = e.touches[0].clientX;
			mouse.y = e.touches[0].clientY;
		}
	}

	function onTouchEnd() {
		mouse.x = -9999;
		mouse.y = -9999;
	}

	function initScene() {
		ww = canvas.width = window.innerWidth;
		wh = canvas.height = window.innerHeight;

		ctx.clearRect(0, 0, canvas.width, canvas.height);

		ctx.font = 'bold 16vw "Microsoft YaHei", "SimHei", sans-serif';
		ctx.textAlign = "center";
		ctx.textBaseline = "middle";
		ctx.fillStyle = "#fff";
		ctx.fillText(headline.textContent, ww / 2, wh / 2);

		var data = ctx.getImageData(0, 0, ww, wh).data;
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		ctx.globalCompositeOperation = "screen";

		particles = [];
		var step = Math.max(4, Math.round(ww / 250));
		for (var i = 0; i < ww; i += step) {
			for (var j = 0; j < wh; j += step) {
				if (data[((i + j * ww) * 4) + 3] > 200) {
					particles.push(new Particle(i, j));
				}
			}
		}
		amount = particles.length;
	}

	function render() {
		requestAnimationFrame(render);
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		for (var i = 0; i < amount; i++) {
			particles[i].render();
		}
	}

	window.addEventListener("resize", function() {
		clearTimeout(resizeTimer);
		resizeTimer = setTimeout(initScene, 300);
	});
	window.addEventListener("mousemove", onMouseMove);
	window.addEventListener("touchmove", onTouchMove);
	window.addEventListener("touchend", onTouchEnd);
	initScene();
	render();
})();
</script>
</body>
</html>
